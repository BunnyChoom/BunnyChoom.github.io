  <canvas id="rain"></canvas>

  <script>
    // --- pixel rain burst on click ---
    const rain = document.getElementById("rain");
    const ctx = rain.getContext("2d");
    function fit() { rain.width = innerWidth; rain.height = innerHeight; }
    fit();
    addEventListener("resize", fit);

    let bits = [];
    addEventListener("click", function (e) {
      const startHue = Math.random() * 360;
      for (let i = 0; i < 40; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        bits.push({
          x: e.clientX, y: e.clientY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          hue: startHue,
          life: 1
        });
      }
    });

    function tick() {
      ctx.clearRect(0, 0, rain.width, rain.height);
      for (const b of bits) {
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.08;
        b.hue += 3;
        b.life -= 0.015;
        ctx.globalAlpha = Math.max(b.life, 0);
        ctx.fillStyle = "hsl(" + b.hue + ", 70%, 85%)";
        const px = 4;
        ctx.fillRect(Math.round(b.x / px) * px, Math.round(b.y / px) * px, px, px);
      }
      ctx.globalAlpha = 1;
      bits = bits.filter(b => b.life > 0);
      requestAnimationFrame(tick);
    }
    tick();

    document.getElementById("back-btn").addEventListener("click", function () {
      document.getElementById("home").style.display = "none";
      document.getElementById("enter").style.display = "flex";
    });


    document.getElementById("enter-btn").addEventListener("click", function () {
      document.getElementById("enter").style.display = "none";
      document.getElementById("home").style.display = "block";
    });
  </script>
